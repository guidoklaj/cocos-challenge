services:
  db:
    image: postgres:16-alpine
    container_name: cocos-db
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - "5432:5432"
    volumes:
      - cocos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos -d cocos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cocos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cocos
      DB_USER: cocos
      DB_PASSWORD: cocos
    ports:
      - "8080:8080"

volumes:
  cocos-db-data:
